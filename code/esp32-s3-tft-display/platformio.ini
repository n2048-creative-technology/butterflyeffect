; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    ; Using local TFT_eSPI library
monitor_speed = 115200
upload_speed = 921600

; Serial debug goes over the native USB (USB-Serial-JTAG on GPIO19/20, wired to
; J4). This maps Serial to the USB CDC instead of UART0, whose pins GPIO43/44
; now carry the RD03D radar link.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Do not touch DTR/RTS when opening the monitor: on this board those lines are
; the USB-Serial-JTAG reset/boot controls and would drop the chip into download
; mode (there is no BOOT/RESET button to recover with).
monitor_rts = 0
monitor_dtr = 0